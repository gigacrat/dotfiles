add_newline = true
command_timeout = 200
format = "$time [$directory$git_branch$git_status]($style)$python${custom.venv_off}$character"

[character]
error_symbol = "[✗](red)"
success_symbol = "[◆](yellow)"

[time]
disabled = false
format = "[\\[$time\\]](bold bright-black)"
time_format = "%^b-%d %H:%M:%S"

[python]
format = "[]($style) "
style = "green"
detect_extensions = []
detect_files = []
detect_folders = []

[custom.venv_off]
when = 'test -z "$VIRTUAL_ENV" && { test -d .venv || test -d venv; }'
format = "[](dimmed) "

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
