# ----------------------------------------------------------------------------
# Prefix
# ----------------------------------------------------------------------------
# Replace the default Ctrl+b with Ctrl+Space, and still allow sending a
# literal prefix to nested programs via prefix + Ctrl+Space.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# ----------------------------------------------------------------------------
# General behavior
# ----------------------------------------------------------------------------
# Refresh the status bar every second (needed for live clocks/counters).
set -g status-interval 1

# Keep a generous scrollback buffer per pane.
set -g history-limit 10000

# Use vi-style keybindings in copy-mode.
setw -g mode-keys vi

# Enable mouse support: click to select panes/windows, drag borders to resize,
# and use the scroll wheel to enter copy-mode.
set -g mouse on


# ----------------------------------------------------------------------------
# Appearance / status bar
# ----------------------------------------------------------------------------
# Move the status bar to the top of the screen.
set -g status-position top

# Base colors for the status bar.
set -g status-style       "bg=#061319,fg=#cce9fe"
set -g status-left-style  "fg=#4e99da"
set -g status-right-style "fg=#85a1ad"

# Window list: dim inactive windows, highlight the current one.
set -g window-status-style         "fg=#5c7b8a"
set -g window-status-current-style "fg=#cce9fe,bg=#0f242c"

# Window list entry format: "<index>:<name>".
set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "


# ----------------------------------------------------------------------------
# Config reload
# ----------------------------------------------------------------------------
# prefix + r  ->  reload this file in place.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"


# ----------------------------------------------------------------------------
# Session management
# ----------------------------------------------------------------------------
bind s choose-tree -Zs                                          # interactive session picker
bind S command-prompt -I "#S" "rename-session '%%'"             # rename current session
bind C command-prompt -p "new session name:" "new-session -s '%%'"  # create named session
bind -r N switch-client -n                                      # next session (repeatable)
bind -r P switch-client -p                                      # previous session (repeatable)
bind Space switch-client -l                                     # toggle to last session
bind X confirm-before -p "kill session '#S'? (y/n)" kill-session
bind Q confirm-before -p "kill tmux server? (y/n)" kill-server


# ----------------------------------------------------------------------------
# Window management
# ----------------------------------------------------------------------------
bind c new-window                                    # new window
bind R command-prompt -I "#W" "rename-window '%%'"   # rename current window
bind w choose-tree -Zw                               # interactive window picker
bind x confirm-before -p "kill window '#W'? (y/n)" kill-window
bind "<" swap-window -t -1                           # move window left
bind ">" swap-window -t +1                           # move window right


# ----------------------------------------------------------------------------
# Pane management (vim-style)
# ----------------------------------------------------------------------------
# Splits.
bind | split-window -h    # split horizontally (side by side)
bind - split-window -v    # split vertically (stacked)

# Navigate between panes with h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + h/j/k/l (repeatable, 5 cells per press).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ----------------------------------------------------------------------------
# Scrolling / copy-mode
# ----------------------------------------------------------------------------
# Scroll wheel: if already in copy-mode, pass the event through so scrolling
# continues; otherwise enter copy-mode first (-e exits at the bottom).
bind -n WheelUpPane if-shell -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e; send-keys -M"

# prefix + [  ->  enter copy-mode (classic shortcut).
bind [ copy-mode

# In vi copy-mode, 'y' copies the selection and exits.
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
